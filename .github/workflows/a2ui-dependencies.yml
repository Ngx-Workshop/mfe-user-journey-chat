name: Prepare pinned A2UI manifests
on:
  push:
    branches: [codex/a2ui-experience]
permissions:
  contents: write
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve exact dependencies without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact @a2ui/lit@0.15.0 @a2ui/web_core@0.15.0
      - name: Commit source manifests only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: pin official A2UI renderer dependencies"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:codex/a2ui-experience
